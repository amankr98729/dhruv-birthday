<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday Dhruv!</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: Arial, sans-serif;
      color: #fff;
      text-align: center;
      background: linear-gradient(135deg, #7b2ff7, #f107a3, #ff8a00);
    }
    .card {
      width: min(90%, 680px);
      padding: 44px 28px;
      border: 2px solid rgba(255,255,255,.45);
      border-radius: 28px;
      background: rgba(255,255,255,.16);
      box-shadow: 0 18px 45px rgba(35, 0, 65, .35);
      backdrop-filter: blur(9px);
    }
    h1 { margin: 0; font-size: clamp(2.4rem, 8vw, 5rem); }
    .cake { font-size: clamp(5rem, 16vw, 9rem); margin: 18px 0 6px; animation: bounce 1.4s infinite; }
    .dog-photo {
      width: min(250px, 72vw);
      height: 165px;
      display: block;
      margin: 20px auto 4px;
      border: 4px solid rgba(255,255,255,.85);
      border-radius: 20px;
      object-fit: cover;
      box-shadow: 0 8px 20px rgba(35, 0, 65, .28);
    }
    .birthday-friends {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin: 20px auto 4px;
    }
    .aman { font-size: 5rem; filter: drop-shadow(0 6px 8px rgba(35, 0, 65, .25)); }
    .speech-bubble {
      max-width: 225px;
      padding: 14px;
      border-radius: 18px;
      color: #6422a8;
      font-weight: bold;
      font-size: 1rem;
      background: #fff;
      box-shadow: 0 6px 16px rgba(35, 0, 65, .2);
    }
    .dog-name {
      display: inline-block;
      padding: 7px 16px;
      margin-bottom: 4px;
      border-radius: 999px;
      color: #6422a8;
      font-weight: bold;
      background: #fff;
    }
    p { font-size: clamp(1.05rem, 2.8vw, 1.4rem); line-height: 1.6; }
    button {
      border: 0;
      border-radius: 999px;
      padding: 14px 24px;
      font-size: 1rem;
      font-weight: bold;
      color: #7b2ff7;
      cursor: pointer;
      background: #fff;
      transition: transform .2s;
    }
    button:hover { transform: scale(1.06); }
    .confetti { position: fixed; top: -20px; pointer-events: none; animation: fall linear forwards; }
    @keyframes bounce { 50% { transform: translateY(-12px) rotate(3deg); } }
    @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
  </style>
</head>
<body>
  <main class="card">
    <h1>Happy Birthday, Dhruv! &#127881;</h1>
    <div class="cake">&#127874;</div>
    <div class="birthday-friends">
      <div class="aman" aria-label="Aman">&#128102;</div>
      <div class="speech-bubble">Happy Birthday, Dhruv!<br>You are the best birthday dog! &#128062;<br>&mdash; Aman</div>
    </div>
    <div class="dog-name">Dhruv the Birthday Dog &#128054;</div>
    <img class="dog-photo" src="https://images.unsplash.com/photo-1558788353-f76d92427f16?auto=format&fit=crop&w=700&q=85" alt="Dhruv, the happy birthday dog" />
    <p>Wishing you a year full of big wins, great memories, and plenty of cake!</p>
    <button onclick="celebrate()">Click for a surprise &#10024;</button>
  </main>

  <script>
    function celebrate() {
      const colors = ['#fff', '#ffe500', '#00f5d4', '#ff70a6', '#8aff80'];
      for (let i = 0; i < 120; i++) {
        const piece = document.createElement('span');
        piece.className = 'confetti';
        piece.textContent = '\u25CF';
        piece.style.left = Math.random() * 100 + 'vw';
        piece.style.color = colors[Math.floor(Math.random() * colors.length)];
        piece.style.fontSize = (10 + Math.random() * 18) + 'px';
        piece.style.animationDuration = (2 + Math.random() * 2) + 's';
        document.body.appendChild(piece);
        setTimeout(() => piece.remove(), 4200);
      }
    }

    function playBirthdaySong() {
      window.speechSynthesis.cancel();
      const lyrics = new SpeechSynthesisUtterance(
        'Hi Dhruv the birthday dog! This is Aman wishing you a very happy birthday! May your treats be huge, your toys be awesome, and your age remain a highly classified secret! Hip hip hooray!'
      );
      lyrics.rate = 1.15;
      lyrics.pitch = 1.55;
      lyrics.volume = 1;
      window.speechSynthesis.speak(lyrics);

      const audio = new (window.AudioContext || window.webkitAudioContext)();
      const notes = [
        [261.63, .22], [261.63, .22], [293.66, .45], [261.63, .45], [349.23, .45], [329.63, .8],
        [261.63, .22], [261.63, .22], [293.66, .45], [261.63, .45], [392.00, .45], [349.23, .8]
      ];
      let time = audio.currentTime;
      notes.forEach(([frequency, length]) => {
        const note = audio.createOscillator();
        const volume = audio.createGain();
        note.type = 'triangle';
        note.frequency.value = frequency;
        volume.gain.setValueAtTime(.13, time);
        volume.gain.exponentialRampToValueAtTime(.001, time + length);
        note.connect(volume).connect(audio.destination);
        note.start(time);
        note.stop(time + length);
        time += length;
      });
      celebrate();
    }

    window.addEventListener('load', () => {
      setTimeout(playBirthdaySong, 450);
    });
  </script>
</body>
</html>
